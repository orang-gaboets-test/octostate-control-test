name: Validate octostate config

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - config/organization.yaml
  push:
    branches:
      - main
    paths:
      - config/organization.yaml

permissions:
  contents: read

jobs:
  validate:
    name: Validate desired state
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'automation/repository-request-') &&
        github.event.pull_request.user.login == vars.OCTOSTATE_PR_APP_LOGIN
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install octostate
        run: go install github.com/orang-gaboets/octostate/cmd/octostate@v1.1.0

      - name: Validate config
        run: octostate config validate --config-dir ./config

  preflight:
    name: Preflight apply check
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'automation/repository-request-') &&
      github.event.pull_request.user.login == vars.OCTOSTATE_PR_APP_LOGIN
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Create preflight GitHub App token
        id: preflight-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OCTOSTATE_PREFLIGHT_APP_CLIENT_ID }}
          private-key: ${{ secrets.OCTOSTATE_PREFLIGHT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read
          permission-metadata: read

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install octostate
        run: go install github.com/orang-gaboets/octostate/cmd/octostate@v1.1.0

      - name: Validate config
        run: octostate config validate --config-dir ./config

      - name: Preflight apply
        run: octostate config apply --config-dir ./config --check --token "${{ steps.preflight-app-token.outputs.token }}"
