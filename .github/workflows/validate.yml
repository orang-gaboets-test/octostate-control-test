name: Validate octostate config

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate desired state
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install octostate
        run: go install github.com/orang-gaboets/octostate/cmd/octostate@v1.0.0

      - name: Validate config
        run: octostate config validate --config-dir ./config
