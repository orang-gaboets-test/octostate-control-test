name: Apply octostate config

on:
  workflow_run:
    workflows:
      - Validate octostate config
    types:
      - completed

permissions:
  contents: read

jobs:
  apply:
    name: Apply desired state
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: octostate-apply-${{ github.repository }}
      # Do not cancel an in-flight apply; octostate apply is not transactional.
      cancel-in-progress: false
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    env:
      VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Verify apply token
        env:
          OCTOSTATE_BOT_TOKEN: ${{ secrets.OCTOSTATE_BOT_TOKEN }}
        run: |
          if [ -z "$OCTOSTATE_BOT_TOKEN" ]; then
            echo "OCTOSTATE_BOT_TOKEN is required for live apply."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install octostate
        run: go install github.com/orang-gaboets/octostate/cmd/octostate@v1.1.0

      - name: Validate config
        run: octostate config validate --config-dir ./config

      - name: Apply config if validated commit is still current
        id: apply
        env:
          OCTOSTATE_BOT_TOKEN: ${{ secrets.OCTOSTATE_BOT_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          current_main_sha="$(git rev-parse origin/main)"
          if [ "$current_main_sha" != "$VALIDATED_SHA" ]; then
            validated_config_blob="$(git rev-parse "$VALIDATED_SHA:config/organization.yaml")"
            current_main_config_blob="$(git rev-parse "origin/main:config/organization.yaml")"
            if [ "$current_main_config_blob" = "$validated_config_blob" ]; then
              echo "main advanced to $current_main_sha, but config/organization.yaml is unchanged; proceeding with live apply."
            else
              echo "applied=false" >> "$GITHUB_OUTPUT"
              echo "Skipping live apply because config/organization.yaml changed after validation of $VALIDATED_SHA."
              {
                echo "### Live apply skipped"
                echo
                printf 'Validated commit: `%s`\n' "$VALIDATED_SHA"
                printf 'Current main: `%s`\n' "$current_main_sha"
                echo
                echo "A newer successful validation run will reconcile the current main state."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          octostate config apply --config-dir ./config --token "$OCTOSTATE_BOT_TOKEN"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Check for newer main commit after apply
        if: success() && steps.apply.outputs.applied == 'true'
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          latest_main_sha="$(git rev-parse origin/main)"
          if [ "$latest_main_sha" != "$VALIDATED_SHA" ]; then
            validated_config_blob="$(git rev-parse "$VALIDATED_SHA:config/organization.yaml")"
            latest_main_config_blob="$(git rev-parse "origin/main:config/organization.yaml")"
            if [ "$latest_main_config_blob" = "$validated_config_blob" ]; then
              echo "main advanced during apply, but config/organization.yaml is unchanged."
              exit 0
            fi
            echo "applied=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Apply completed on a stale revision"
              echo
              printf 'Applied commit: `%s`\n' "$VALIDATED_SHA"
              printf 'Current main: `%s`\n' "$latest_main_sha"
              echo
              echo "The newer commit's validation and apply workflow will reconcile the current state."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Applied revision is still current main."
