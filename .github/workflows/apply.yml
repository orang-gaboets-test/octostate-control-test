name: Apply octostate config

on:
  push:
    branches:
      - main
    paths:
      - config/organization.yaml

permissions:
  contents: read

concurrency:
  group: octostate-apply-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply desired state
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OCTOSTATE_BOT_TOKEN: ${{ secrets.OCTOSTATE_BOT_TOKEN }}

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify apply token
        run: |
          if [ -z "$OCTOSTATE_BOT_TOKEN" ]; then
            echo "OCTOSTATE_BOT_TOKEN is required for live apply."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install octostate
        run: go install github.com/orang-gaboets/octostate/cmd/octostate@v1.1.0

      - name: Validate config
        run: octostate config validate --config-dir ./config

      - name: Apply config
        run: octostate config apply --config-dir ./config --token "$OCTOSTATE_BOT_TOKEN"
