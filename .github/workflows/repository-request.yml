name: Repository request

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: read

jobs:
  create-draft-pr:
    name: Create draft PR
    if: contains(github.event.issue.labels.*.name, 'repository') || startsWith(github.event.issue.title, 'Create repository:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.x"
          cache: false

      - name: Create PR GitHub App token
        id: pr-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.OCTOSTATE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.OCTOSTATE_PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Verify PR App identity
        env:
          EXPECTED_APP_LOGIN: ${{ vars.OCTOSTATE_PR_APP_LOGIN }}
          ACTUAL_APP_LOGIN: ${{ steps.pr-app-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          if [ "$ACTUAL_APP_LOGIN" != "$EXPECTED_APP_LOGIN" ]; then
            echo "OCTOSTATE_PR_APP_LOGIN must equal $ACTUAL_APP_LOGIN"
            exit 1
          fi

      - name: Update desired state
        working-directory: tools/issue-to-config
        run: go run . --event-path "$GITHUB_EVENT_PATH" --config ../../config/organization.yaml

      - name: Install octostate
        run: go install github.com/orang-gaboets/octostate/cmd/octostate@v1.1.0

      - name: Validate config
        run: octostate config validate --config-dir ./config

      - name: Resolve PR App commit identity
        id: pr-app-identity
        env:
          GH_TOKEN: ${{ steps.pr-app-token.outputs.token }}
          APP_SLUG: ${{ steps.pr-app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/$bot_login" --jq .id)"
          echo "identity=$bot_login <$bot_id+$bot_login@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Create draft pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          token: ${{ steps.pr-app-token.outputs.token }}
          branch: automation/repository-request-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: Add repository request from issue #${{ github.event.issue.number }}
          author: ${{ steps.pr-app-identity.outputs.identity }}
          committer: ${{ steps.pr-app-identity.outputs.identity }}
          title: Add repository from issue #${{ github.event.issue.number }}
          body: |
            Applies the repository request from #${{ github.event.issue.number }}.

            This PR was generated from a repository issue form and only updates desired state.
            The repository request workflow validated this config before opening the PR.
            This PR is created with a GitHub App token so separate PR validation workflows can run normally.
          draft: true
