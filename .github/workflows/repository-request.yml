name: Repository request

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: read

jobs:
  create-draft-pr:
    name: Create draft PR
    if: contains(github.event.issue.labels.*.name, 'repository') || startsWith(github.event.issue.title, 'Create repository:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: false

      - name: Create PR GitHub App token
        id: pr-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OCTOSTATE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.OCTOSTATE_PR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update desired state
        working-directory: tools/issue-to-config
        run: go run . --event-path "$GITHUB_EVENT_PATH" --config ../../config/organization.yaml

      - name: Install octostate
        run: go install github.com/orang-gaboets/octostate/cmd/octostate@v1.1.0

      - name: Validate config
        run: octostate config validate --config-dir ./config

      - name: Create draft pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.pr-app-token.outputs.token }}
          branch-token: ${{ steps.pr-app-token.outputs.token }}
          branch: automation/repository-request-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: Add repository request from issue #${{ github.event.issue.number }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: Add repository from issue #${{ github.event.issue.number }}
          body: |
            Applies the repository request from #${{ github.event.issue.number }}.

            This PR was generated from a repository issue form and only updates desired state.
            The repository request workflow validated this config before opening the PR.
            This PR is created with a GitHub App token so separate PR validation workflows can run normally.
          draft: true
